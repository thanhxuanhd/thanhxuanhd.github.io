<div class="glass-panel col-span-12 space-y-8 p-6 sm:p-8">
  <div>
    <div class="mb-10 flex items-center text-xl font-bold text-slate-900 dark:text-on-surface">
      <span
        class="rounded-full border border-sky-200/70 bg-sky-50/80 px-4 py-2 text-sky-700 shadow-sm backdrop-blur-md dark:border-white/10 dark:bg-slate-700/80 dark:text-sky-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z" />
        </svg>
      </span>
      <span class="ml-3">
        Work Experiences
      </span>
    </div>
    <div class="relative space-y-0">
      @for (work of works; track work; let isFirst = $first) {
      <div class="relative pl-8 pb-10 border-l-2 last:pb-0 last:border-l-0">
        <div class="absolute -left-[9px] top-1 h-4 w-4 rounded-full border-2 bg-white dark:bg-surface-container"
          [ngClass]="isFirst ? 'border-sky-600 dark:border-primary transition-all duration-300': 'border-slate-300 dark:border-white/20'">
        </div>
        <div
          class="rounded-xl border border-slate-200/70 bg-slate-50/90 p-4 shadow-sm shadow-slate-200/40 backdrop-blur-xl transition-all duration-300 hover:translate-x-1 hover:bg-white hover:shadow-lg dark:border-white/10 dark:bg-slate-800/80 dark:shadow-black/20 dark:hover:bg-slate-700/90">
          <div class="flex items-center justify-between">
            <h3 class="mb-1 font-semibold text-sky-700 dark:text-sky-300 text-xl">{{ work.companyName }}</h3>
            <span class="font-label-code text-label-code text-primary font-medium tracking-wide"
              [innerHTML]="work.workTimes"></span>
          </div>
          <p class="font-body-lg text-body-lg">{{ work.role }}</p>
        </div>
      </div>
      }
    </div>
  </div>
</div>
<div class="glass-panel col-span-12 mt-6 space-y-8 p-6 sm:p-8">
  <div>
    <div class="mb-10 flex items-center text-xl font-bold text-slate-900 dark:text-on-surface">
      <span
        class="rounded-full border border-sky-200/70 bg-sky-50/80 px-4 py-2 text-sky-700 shadow-sm backdrop-blur-md dark:border-white/10 dark:bg-slate-700/80 dark:text-sky-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m6.75 7.5 3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0 0 21 18V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v12a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
      </span>
      <span class="ml-3">
        Skills
      </span>
    </div>
    @for (category of skills; track category.name) {
    <h3
      class="my-5 mb-4 flex items-center text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-on-surface-variant">
      <span class="mr-2 h-2 w-2 rounded-full bg-sky-600 dark:bg-sky-300"></span>
      {{ category.name }}
    </h3>
    @if (category.children.length > 0) {
    <div class="flex flex-wrap gap-2">
      @for (skill of category.children; track skill) {
      <div
        class="tech-item group flex cursor-pointer items-center gap-2 rounded-full border border-slate-200/70 bg-slate-50/90 px-4 py-2 shadow-sm shadow-slate-200/40 backdrop-blur-md transition-all duration-200 hover:scale-105 hover:bg-white dark:border-white/10 dark:bg-slate-800/80 dark:shadow-black/20 dark:hover:bg-slate-700/90">
        <span
          class="w-1.5 h-1.5 rounded-full bg-sky-600 dark:bg-sky-300 group-hover:scale-150 transition-transform"></span>
        <span class="font-label-code text-label-code text-slate-700 dark:text-slate-100">
          {{ skill }}
        </span>
      </div>
      }
    </div>
    }
    }
  </div>
</div>
